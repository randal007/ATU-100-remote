<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- atutop in the browser, served by the ESP32 bridge. No outside
         fonts or scripts: it must work off-grid on the bridge's hotspot. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#121212" />
    <title>atutop</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
      html, body { margin: 0; height: 100%; background: #121212; overflow: hidden; }
      pre {
        font-family: "DejaVu Sans Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 15px;
        margin: 0;
      }
      @media (max-width: 700px) { pre { font-size: 13px; } }
      #grid:focus { outline: none; }
      /* the real text box placed over a settings field while typing */
      #atu_field {
        position: fixed; display: none; z-index: 10; box-sizing: border-box;
        margin: 0; padding: 0 0 0 0.6ch; border: 0; outline: 1px solid #b54040;
        background: #303030; color: #eeeeee; caret-color: #b54040;
        font-family: "DejaVu Sans Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 16px; /* 16px or more: phones do not zoom in on focus */
      }
    </style>
  </head>
  <body></body>
</html>
