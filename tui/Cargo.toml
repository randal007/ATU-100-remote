[package]
name = "atutop"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "wasmbind"] }
serde_json = "1.0.154"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ratatui = "0.30.2"
serialport = { version = "4.10.1", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["std", "all-widgets", "layout-cache"] }
# 0.3.1 sizes the screen by guesswork; fixed after it (the grid it measured). Back to a release once one has it
ratzilla = { git = "https://github.com/ratatui/ratzilla", rev = "2f6f7eff05d966b9e9efcbacbca0027991123b5a" }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "Location", "WebSocket", "MessageEvent", "CloseEvent", "Event", "KeyboardEvent", "DomRect", "CssStyleDeclaration", "HtmlCollection", "Node", "MouseEvent", "WheelEvent", "EventTarget", "PointerEvent"] }
